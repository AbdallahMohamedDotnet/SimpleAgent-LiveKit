[project]
name = "interview-app"
version = "0.1.0"
description = "Local, evidence-based voice interview application"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "aiosqlite==0.21.0",
    "livekit-agents==1.8.2",
    "livekit-plugins-elevenlabs==1.8.2",
    "livekit-plugins-openai==1.8.2",
]

[project.scripts]
interview = "interview_app.entrypoints.cli:main"
interview-agent = "interview_app.entrypoints.agent_server:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.18,<2",
    "pytest>=9,<10",
    "ruff>=0.13,<1",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.14"
strict = true
packages = ["interview_app"]
mypy_path = "src"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
